[project]
name = "laya-qwen"
version = "0.1.0"
description = "Johnny 5: the local half of a two-half personal AI system. Verified answering over local reference shelves, a moderated room of frontier models (the Robot Factory and S.A.I.N.T.), and a live bridge to the moderator."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyarrow>=17"]

[project.optional-dependencies]
laya = ["laya>=0.4.8"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "opentelemetry-sdk>=1.45", "opentelemetry-exporter-otlp-proto-grpc>=1.45",
           "openinference-semantic-conventions>=0.1.41"]
corpus = ["selectolax>=0.3.21"]

[project.scripts]
laya-qwen-eval = "laya_qwen.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_qwen"]
