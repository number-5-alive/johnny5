# Robot Factory budget. Read by run-next.sh (via bin/budget.py) at run
# time; no script carries its own copy of these numbers.
# Dan's rulings Q3 and Q4, 2026-10-31. Phase 2 (task 006) installed it.
# Format: flat "key: value", one level of two-space nesting, # comments.
# bin/budget.py parses it with the stdlib and fails closed on anything
# else, so keep it this simple.

# Q3: caps count the CLI-reported dollar figure (list-price notional on
# the subscription). The per-call token caps are the real quota protection.
cost_basis: cli-reported

# Q4: across all bodies, from ledger.jsonl, by calendar month (local time).
# Raised 50 -> 75 by Dan's ruling 2026-11-02 (November launch campaign headroom).
monthly_ceiling_usd: 75.00

factory:
  session_cap_usd: 10.00
  round_cap: 3
  plan_gate: on

saint:
  session_cap_usd: 6.50
  # Raised 5.00 -> 6.50 by Dan's ruling 2026-11-02 (027-S1): the 2.00 overshoot reserve vs the per-call split (5.00/3 = 1.66) refused standard SAINT rooms; 6.50 restores them with the reserve discipline unchanged.
  round_cap: 3

# Per-call token caps (spec 5.1).
# Dan 2026-10-31, after task 008 died on the 8000 cap: frontier output cap raised for document-length tasks.
frontier:
  max_in_tokens: 60000
  max_out_tokens: 32000

local:
  max_in_tokens: 24000
  max_out_tokens: 4000

# The runner pauses for Dan when an artifact grows past this (Factory sessions).
artifact_pause_tokens: 20000

# ---- Phase 2 queue settings. These are CHOICES made in task 006 where
# ---- the spec was silent. Each is flagged in work/006-phase2-result.md.
queue:
  # A v0 queue task is one commission run by one seat, so it takes the
  # Factory session cap as its default effective cap.
  default_cap_from: factory.session_cap_usd
  # The queue's seat (claude-code) is a frontier seat for token caps.
  seat_class: frontier
  # The CLI checks --max-budget-usd AFTER each request, so it can finish
  # one request past its budget. The runner hands the CLI (cap - reserve),
  # so the request that crosses has this much headroom under the cap.
  overshoot_reserve_usd: 2.00  # raised 2026-11-01 by Dan's ruling (was 1.00; the 1.25 recommendation was sized against the old 8k output cap; at 32k out the worst-case single request is ~1.44-1.64 at fitted prices)
  # Closest enforceable form of max_in_tokens for a multi-request agent run:
  # the CLI's own auto-compact window (its floor is 100k). 0 = don't pass it.
  autocompact_tokens: 100000
  # Pre-flight token estimate for the task prompt (spec 5.2: chars / 3).
  chars_per_token: 3

# ---- Phase 5 (task 012, 2026-11-01): billing classes. CHOICES, each
# ---- C-listed in work/012-phase5-result.md for Dan to ratify.
# Two classes, never added together:
#   subscription: pacing tally. USD seats (claude-code) count against
#     monthly_ceiling_usd above; token seats (codex, gemini-cli) count
#     tokens against their own monthly_pacing_tokens below.
#   api: real dollars, against this separate ceiling. Dan set $25.00 on
#     2026-11-01 (0.00 would refuse every api call).
api_monthly_ceiling_usd: 25.00

# Token-metered subscription seats. The CLIs report no dollar figure, so
# none is recorded. Per-call caps are checked by pre-flight (input) and
# recorded after the call (output: neither CLI has an output-cap flag).
codex:
  max_in_tokens: 60000
  max_out_tokens: 32000
  monthly_pacing_tokens: 2000000

gemini_cli:
  max_in_tokens: 60000
  max_out_tokens: 32000
  monthly_pacing_tokens: 2000000

# ---- Phase 6 (task 014, 2026-11-01): api seats (jev, deepseek, perplexity,
# ---- gemini_api, grok). CHOICES, C-listed in work/014-phase6-result.md.
# Per-call token caps for every api seat (registry token_class "api").
# The pre-flight worst case is max_in x input price + max_out x output
# price (+ any per-call fee), rounded UP to the cent, and must fit the task
# cap and api_monthly_ceiling_usd (above; $25.00 per Dan, 2026-11-01).
api:
  max_in_tokens: 60000
  max_out_tokens: 8000
